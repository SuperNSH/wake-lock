name: CI

# Every compile and test runs here, on GitHub's runners, never on a developer's machine.
# kache caches compiler outputs in GitHub's Actions cache; only master saves to it.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        with:
          version: v2.0.0
          cache-dir: ${{ runner.temp }}/kache
          manifest-key: rust-ubuntu-latest
          cache-key-prefix: kache-rust-ubuntu-latest
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          pr-comment: false
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26
      - run: npm ci
        working-directory: packages/nsh-wake-lock
      - run: npm run typecheck
        working-directory: packages/nsh-wake-lock
      - run: npm test
        working-directory: packages/nsh-wake-lock

  cross-check:
    name: check (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-ios-sim }
          - { os: windows-latest, target: x86_64-pc-windows-gnu }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: wasm32-unknown-unknown }
          - { os: ubuntu-latest, target: aarch64-linux-android }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
          targets: ${{ matrix.target }}
      - uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        with:
          version: v2.0.0
          cache-dir: ${{ runner.temp }}/kache
          manifest-key: check-${{ matrix.target }}
          cache-key-prefix: kache-check-${{ matrix.target }}
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          pr-comment: false
      - name: Point cc at the NDK
        if: matrix.target == 'aarch64-linux-android'
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64_linux_android=$bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$bin/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
      # No --all-targets: dev-dependencies stay host-only, so each triple only has to build the lib.
      - run: cargo clippy --target ${{ matrix.target }} -- -D warnings
